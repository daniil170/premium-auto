<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Auto | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/signin.css">
</head>
<body>

    <div class="panel-left">
        <div class="bg-grid"></div>
        <div class="bg-lines"></div>
        <div class="panel-left-label">
            <span class="big-letter">PA</span>
        </div>
        <div class="panel-left-tagline">
            <div class="gold-line"></div>
            <h2>Where <em>excellence</em><br>meets the road.</h2>
            <p>Premium Auto — Est. 2026</p>
        </div>
    </div>

    <div class="panel-right">
        <div class="signin-back">
            <a href="index.html">Back to site</a>
        </div>
        <div class="signin-logo">
            <img src="assets/images/palogo.png" alt="Logo">
            <span class="signin-logo-text">Premium Auto</span>
        </div>
        <div class="signin-heading">
            <h1>Welcome <span>back.</span></h1>
            <p>Sign in to your account to continue</p>
        </div>
        <form class="signin-form" id="signinForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="form-forgot">
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-submit">
                <span>Sign In</span>
            </button>
            <div class="divider">
                <span>or</span>
            </div>
            <div class="signin-register">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
            </div>
        </form>
    </div>

    <script src="js/signin.js"></script>
</body>
</html>
